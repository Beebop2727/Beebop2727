name: Update recent repositories

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/update-recent-repos.mjs"
      - ".github/workflows/update-recent-repos.yml"

permissions:
  contents: write

concurrency:
  group: update-profile-repositories
  cancel-in-progress: true

jobs:
  update-readme:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Update recent repositories
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: Beebop2727
        run: node scripts/update-recent-repos.mjs

      - name: Commit changes
        run: |
          if git diff --quiet -- README.md; then
            echo "README is already up to date."
            exit 0
          fi

          git config user.name "Harry Watson"
          git config user.email "86132156+Beebop2727@users.noreply.github.com"
          git add README.md
          git commit -m "chore: update recent repositories"
          git push
